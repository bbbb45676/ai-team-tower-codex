<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 團隊大樓</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: 全幅 3D 舞台；左上品牌與大樓切換，右側浮動資訊卡，左下部門色票，中上審批通知。手機改為上舞台、下資訊卡。 */
:root {
  --bg-a: #f7f4ef; --bg-b: #e6e0d7;
  --surface: #fffdfa; --surface-2: #f4f0ea;
  --ink: #26231f; --muted: #7b746b; --line: #e8e2d9; --line-2: #d8d0c4;
  --primary: #26231f; --on-primary: #fffdfa;
  --amber: #e08a12; --amber-bg: #fff3df; --amber-ink: #8a4f00;
  --shadow: 0 1px 2px rgba(45, 35, 25, .06), 0 10px 30px rgba(45, 35, 25, .10);
  --f-ui: "Plus Jakarta Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --panel-w: 360px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg-a: #232a52; --bg-b: #0d1022; --surface: #191d33; --surface-2: #22273f;
  --ink: #eceaf4; --muted: #9ea3c0; --line: #2a3050; --line-2: #39406a;
  --primary: #eceaf4; --on-primary: #151829; --amber: #f2a33a; --amber-bg: #3a2a12; --amber-ink: #ffd08a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg-a: #232a52; --bg-b: #0d1022; --surface: #191d33; --surface-2: #22273f;
  --ink: #eceaf4; --muted: #9ea3c0; --line: #2a3050; --line-2: #39406a;
  --primary: #eceaf4; --on-primary: #151829; --amber: #f2a33a; --amber-bg: #3a2a12; --amber-ink: #ffd08a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35); color-scheme: dark }

html, body { height: 100%; }
body { margin: 0; overflow: hidden; color: var(--ink); font-family: var(--f-ui); font-size: 14px;
  background: radial-gradient(120% 90% at 42% 38%, var(--bg-a), var(--bg-b)); }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#app { position: relative; height: 100%; }
#wrap { position: absolute; inset: 0; }
#stage { position: absolute; inset: 0; touch-action: none; cursor: grab; }
#stage.drag { cursor: grabbing; }
#stage.hover { cursor: pointer; }
#stage canvas { display: block; width: 100%; height: 100%; }
#ov { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.bar { position: absolute; top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); right: calc(var(--panel-w) + 32px); display: flex; gap: 10px; align-items: center; pointer-events: none; }
.bar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px 7px 9px; box-shadow: var(--shadow); font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; }
.switch { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; box-shadow: var(--shadow); overflow-x: auto; min-width: 0; scrollbar-width: none; }
.sw { border: 0; background: transparent; border-radius: 8px; padding: 6px 11px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; display: flex; gap: 7px; align-items: center; white-space: nowrap; }
.sw svg { width: 14px; height: 14px; }
.sw:hover { color: var(--ink); background: var(--surface-2); }
.sw.on { background: var(--primary); color: var(--on-primary); }
.sw .n { font-weight: 500; opacity: .7; font-variant-numeric: tabular-nums; }
.sw .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 25%, transparent); }
.sw.add { font-weight: 500; }

#panel { position: absolute; top: 14px; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; width: var(--panel-w); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.p-body { overflow-y: auto; padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 22px; min-height: 0; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
h2 { font-size: 21px; line-height: 1.25; margin: 4px 0 0; letter-spacing: -.015em; text-wrap: balance; }
h3 { font-size: 12px; font-weight: 600; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
.sub { color: var(--muted); font-size: 13px; margin: 6px 0 0; line-height: 1.6; }
.back { border: 0; background: none; padding: 0; color: var(--muted); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.back svg { width: 15px; height: 15px; }
.back:hover { color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.warn b { color: var(--amber); }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn svg { width: 15px; height: 15px; }
.btn:hover { border-color: var(--ink); }
.btn.pri { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn[aria-disabled="true"] { opacity: .45; cursor: default; }
.apv { border: 1px solid color-mix(in srgb, var(--amber) 55%, var(--line)); background: var(--amber-bg); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.apv + .apv { margin-top: 8px; }
.apv .who { font-size: 12px; color: var(--amber-ink); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.apv .who svg { width: 14px; height: 14px; }
.apv .req { font-size: 13.5px; font-weight: 600; font-family: var(--f-mono); overflow-wrap: anywhere; }
.apv .row { display: flex; gap: 8px; }
.empty { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 12px; line-height: 1.6; margin: 0; }
.depts { display: grid; }
.dept { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.dept:last-child { border-bottom: 1px solid var(--line); }
.swatch { width: 28px; height: 28px; border-radius: 8px; background: var(--c); display: grid; place-items: center; color: var(--i); }
.swatch svg { width: 15px; height: 15px; }
.dept .nm { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; cursor: pointer; }
.dept .nm:hover { text-decoration: underline; text-underline-offset: 3px; }
.dept .cnt { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.units { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: 1px; }
.units i { width: 9px; height: 9px; border-radius: 3px; background: var(--line-2); }
.units i.on { background: var(--i, var(--ink)); }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.feed li { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 9px; align-items: baseline; font-size: 13px; line-height: 1.45; }
.feed .d { width: 8px; height: 8px; border-radius: 50%; background: var(--i); transform: translateY(-1px); }
.feed .t { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.feed b { font-weight: 600; }
.feed .x { overflow-wrap: anywhere; }
.log { list-style: none; margin: 0; padding: 12px; display: grid; gap: 6px; background: #1d1c22; color: #e7e3da; border-radius: 10px; font-family: var(--f-mono); font-size: 11.5px; line-height: 1.5; }
.log li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.log time { color: #8d877c; }
.log span { overflow-wrap: anywhere; }
.now { display: flex; gap: 12px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 12px; }
.now .ic { width: 40px; height: 40px; border-radius: 11px; background: var(--c); color: var(--i); display: grid; place-items: center; flex: none; }
.now .ic svg { width: 20px; height: 20px; }
.now b { display: block; font-size: 14px; }
.now span { font-size: 12.5px; color: var(--muted); font-family: var(--f-mono); overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.pill.work { background: color-mix(in srgb, #2f8a5f 15%, transparent); color: #2f8a5f; }
.pill.wait { background: var(--amber-bg); color: var(--amber-ink); }
.members { display: flex; flex-wrap: wrap; gap: 6px; }
.mem { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 5px; font-size: 13px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.mem i { width: 16px; height: 16px; border-radius: 50%; background: var(--i); }
.mem:hover { border-color: var(--ink); }
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 12px 0 8px; }
.meter i { display: block; height: 100%; background: var(--i); border-radius: 99px; }
.row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.banner { height: 6px; border-radius: 99px; background: var(--c); margin-bottom: 14px; }
.map { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 12px; font-size: 13px; margin: 0; align-items: center; }
.map dt { display: flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.map dt svg { width: 14px; height: 14px; }
.map dd { margin: 0; }

#legend { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 16px; right: calc(var(--panel-w) + 96px); display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.chip { pointer-events: auto; display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 5px; font-size: 12.5px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); white-space: nowrap; }
.chip i { width: 20px; height: 20px; border-radius: 50%; background: var(--c); display: grid; place-items: center; color: var(--i); }
.chip i svg { width: 12px; height: 12px; }
.chip:hover { border-color: var(--ink); }
.chip .n { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
#zoom { position: absolute; right: calc(var(--panel-w) + 32px); bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
.zb { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; display: grid; place-items: center; }
.zb svg { width: 17px; height: 17px; }
.zb:hover { border-color: var(--ink); }

#toasts { position: absolute; bottom: 64px; left: 16px; right: calc(var(--panel-w) + 96px); display: flex; flex-direction: column-reverse; align-items: center; gap: 8px; pointer-events: none; }
.toast { pointer-events: auto; width: min(470px, 100%); background: var(--surface); border: 1px solid color-mix(in srgb, var(--amber) 60%, var(--line)); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 10px 10px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; animation: tin .35s cubic-bezier(.2, .8, .2, 1); }
.toast .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--amber); color: #fff; display: grid; place-items: center; }
.toast .ic svg { width: 18px; height: 18px; }
.toast .w { font-size: 12px; color: var(--muted); }
.toast .w b { color: var(--ink); }
.toast .r { font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
.toast .a { display: flex; gap: 6px; }
@keyframes tin { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

.tag { position: absolute; left: 0; top: 0; will-change: transform; display: flex; flex-direction: column; align-items: center; }
.bub { display: flex; align-items: center; gap: 5px; background: rgba(255, 253, 250, .96); color: #2a2622; border-radius: 999px; padding: 3px 9px 3px 6px; font-size: 11.5px; font-weight: 600; box-shadow: 0 1px 3px rgba(40, 30, 20, .18); white-space: nowrap; max-width: 190px; }
.bub span { overflow: hidden; text-overflow: ellipsis; }
.bub svg { width: 13px; height: 13px; flex: none; color: var(--i, #555); }
.bub.none { display: none; }
.far .bub { padding: 4px; }
.far .bub span { display: none; }
.bub.wait { background: #e08a12; color: #fff; position: relative; }
.bub.wait svg { color: #fff; }
.bub.wait::after { content: ""; position: absolute; inset: -4px; border-radius: 999px; border: 2px solid #e08a12; animation: ping 1.4s ease-out infinite; }
@keyframes ping { from { opacity: .8; transform: scale(.9); } to { opacity: 0; transform: scale(1.35); } }
.tname { margin-top: 3px; font-size: 10.5px; font-weight: 600; color: #3b3630; background: rgba(255, 255, 255, .8); border-radius: 5px; padding: 0 6px; }
.far .tag:not(.sel) .tname { display: none; }
.tag.sel .tname { background: #26231f; color: #fff; }
.rl { position: absolute; left: 0; top: 0; will-change: transform; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #2a2622; background: rgba(255, 253, 250, .85); border-radius: 8px; padding: 3px 8px 3px 4px; white-space: nowrap; }
.rl i { width: 17px; height: 17px; border-radius: 5px; background: var(--i); display: grid; place-items: center; color: #fff; }
.rl i svg { width: 10px; height: 10px; }
.rl span { font-weight: 500; color: #7b746b; font-variant-numeric: tabular-nums; }
.rl.hov { background: #fff; box-shadow: 0 0 0 2px var(--i); }
.rl b { font-weight: 700; }
.farther .rl b, .farther .rl span { display: none; }
.farther .rl { padding: 3px; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; transition: opacity .5s; }
#loading div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 18px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
#loading .sp { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--ink); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading.hidden { opacity: 0; }
[hidden] { display: none !important; }
.conn { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; box-shadow: var(--shadow); white-space: nowrap; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn.on i { background: #2f8a5f; box-shadow: 0 0 0 3px color-mix(in srgb, #2f8a5f 25%, transparent); }
.conn.retry i { background: var(--amber); }
textarea { font: inherit; font-size: 13.5px; line-height: 1.6; width: 100%; box-sizing: border-box; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; background: var(--surface); color: var(--ink); resize: vertical; }
textarea:focus { outline: 2px solid color-mix(in srgb, var(--amber) 60%, transparent); outline-offset: 1px; }
textarea.plan { font-family: var(--f-mono); font-size: 12.5px; min-height: 220px; }
.lbl { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
.tasks { display: grid; gap: 6px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.trow:hover { border-color: var(--ink); }
.trow .tt { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .tt em { font-style: normal; font-weight: 500; color: var(--muted); font-size: 12px; }
.trow .tdepts { grid-column: 1 / -1; display: flex; gap: 5px; }
.dchip { width: 22px; height: 6px; border-radius: 99px; background: var(--line-2); }
.dchip.review { background: var(--amber); }
.dchip.approved, .dchip.running { background: var(--i); opacity: .55; }
.dchip.running { animation: blink 1.2s infinite; }
.dchip.done { background: var(--i); }
.dchip.error { background: #c84a3a; }
.pill.done { background: color-mix(in srgb, #2f8a5f 15%, transparent); color: #2f8a5f; }
.pill.err { background: color-mix(in srgb, #c84a3a 14%, transparent); color: #c84a3a; }
.dcard { border: 1px solid var(--line); border-left: 4px solid var(--i); border-radius: 0; padding: 12px 14px; background: var(--surface); }
.dhead { display: flex; align-items: center; gap: 10px; }
.dhead b { font-size: 15px; flex: 1; }
.dcard details { margin-top: 10px; }
.dcard summary, section > details > summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.md { font-size: 13.5px; line-height: 1.7; overflow-wrap: anywhere; color: var(--ink); }
.md h3 { font-size: 17px; margin: 18px 0 6px; letter-spacing: -.01em; }
.md h4 { font-size: 15px; margin: 16px 0 6px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
.md h5, .md h6 { font-size: 13.5px; margin: 12px 0 4px; }
.md > :first-child { margin-top: 0; }
.md ol, .md ul { margin: 6px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md li > ul, .md li > ol { margin: 2px 0; }
.md a { color: #3d6a99; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.md blockquote { margin: 6px 0; padding: 4px 12px; border-left: 3px solid var(--line-2); color: var(--muted); }
.md .mdt { overflow-x: auto; margin: 8px 0; }
.md table { border-collapse: collapse; font-size: 12.5px; min-width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); font-weight: 600; }
.md .chk { display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--line-2); border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.md .chk.on { background: #2f8a5f; border-color: #2f8a5f; }
.planview { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 10px; }
.pvbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); }
.pvbar .edited { color: var(--amber-ink); }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.planview .md { padding: 14px 16px; max-height: 60vh; overflow: auto; }
.planview textarea.plan { border: 0; border-radius: 0; min-height: 360px; display: block; }
.archq { display: flex; gap: 8px; }
.archq input { flex: 1; font: inherit; font-size: 13.5px; border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 12px; background: var(--surface); color: var(--ink); min-width: 0; }
.archq input:focus { outline: 2px solid color-mix(in srgb, var(--amber) 60%, transparent); outline-offset: 1px; }
.afil { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.afil button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
.afil button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.afilters { display: grid; gap: 4px; }
.flabel { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .05em; margin-top: 10px; }
.flabel.sub2 { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.afilters .afil { margin-top: 2px; align-items: center; }
.afil button { display: inline-flex; align-items: center; gap: 6px; }
.afil .fd { width: 8px; height: 8px; border-radius: 50%; background: var(--i); }
.afil button[aria-pressed="true"] .fd { background: var(--on-primary); }

function mdInline(t) {

function md(src) {

  const flushTable = () => {
    if (!table) return;
    const rows = table.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r)).map(r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
    const [head, ...body] = rows;
    out.push('<div class="mdt"><table><thead><tr>' + head.map(c => `<th>${mdInline(c)}</th>`).join('') + '</tr></thead><tbody>' + body.map(r => '<tr>' + r.map(c => `<td>${mdInline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>');
    table = null;
  };
  const flushAll = () => { flushPara(); flushList(); flushTable(); };
  for (const raw of lines) {
    if (code) {
      if (raw.trim().startsWith('```')) {
        const body = `<pre>${code.map(esc).join('\n')}</pre>`;
        out.push(code.length > 3 ? `<details class="code"><summary>${lang ? esc(lang.toUpperCase()) + ' · ' : ''}${code.length} 行（點開）</summary>${body}</details>` : body);
        code = null;

    }
    if (raw.trim().startsWith('```')) { flushAll(); code = []; lang = raw.trim().slice(3).trim(); continue; }
    if (/^\s*\|.*\|\s*$/.test(raw)) { flushPara(); flushList(); (table = table || []).push(raw); continue; }
    flushTable();
    if (!raw.trim()) { flushPara(); flushList(); continue; }
    const hm = raw.match(/^(#{1,6})\s+(.*)$/);
    if (hm) { flushAll(); const lv = Math.min(6, hm[1].length + 2); out.push(`<h${lv}>${mdInline(hm[2])}</h${lv}>`); continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(raw)) { flushAll(); out.push('<hr>'); continue; }
    if (/^\s*>\s?/.test(raw)) { flushAll(); out.push(`<blockquote>${mdInline(raw.replace(/^\s*>\s?/, ''))}</blockquote>`); continue; }
    const li = raw.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (li) {

      for (const d of sb.departments) DEPT[d.id] = { name: d.name, wall: d.wall || '#e5e1da', ink: d.ink || '#6b6258', icon: d.icon || 'folder', top: d.ink || '#6b6258', dept: true, style: d.style || 'research', line: d.line || '' };
      nb = makeBuilding(sb.name, Object.fromEntries(sb.departments.map(d => [d.id, d.members || 2])), sb.departments.map(d => d.id));
    } else nb = makeBuilding(sb.name, sb.counts || { research: 2, design: 2, dev: 3, test: 2 });
    nb.sid = sb.id; nb.queue = 0; nb.pmName = sb.pm?.name || ''; buildings.push(nb);
  }
} else {
  buildings.push(makeBuilding('官網改版', { research: 2, design: 3, dev: 5, test: 2 }));
  buildings.push(makeBuilding('行動 App', { research: 3, design: 2, dev: 3, test: 1 }));
  buildings.push(makeBuilding('內部工具', { research: 1, design: 2, dev: 2, test: 2 }));
}
scene.add(cur().root);
buildings.forEach((b, i) => setVis(b, i === 0));
updateShadowCam(cur());
placeClouds(cur()); applyTheme(); sizeStage(); fit(true); applyCam(); syncControls(); initHint();
renderSwitch(); renderLegend(); renderPanel(true);
if (LIVE && liveState.share) { document.body.classList.add('share'); const sb = document.createElement('div'); sb.className = 'sharebadge'; sb.textContent = '展示模式 · 只能看'; document.body.appendChild(sb); }
if (LIVE) { startLive(liveState); document.getElementById('dReq').hidden = false; document.getElementById('dArchive').hidden = false; document.getElementById('dGoals').hidden = false; document.getElementById('dAuto').hidden = false; document.getElementById('dPerm').hidden = false; syncPerm(); AUTH = { auth: liveState.auth || 'subscription', apiKeySet: !!liveState.apiKeySet, apiKeySource: liveState.apiKeySource || '', apiKeyHint: liveState.apiKeyHint || '', engine: liveState.engine, chosen: !!liveState.chosen, codexFound: !!liveState.codexFound, login: liveState.login || null }; document.getElementById('dAuth').hidden = false; syncAuth(); for (const j of liveState.setups || []) SETUPS.set(j.id, j); document.getElementById('dTasks').textContent = '任務'; } else setConn('off');
try { const want = sessionStorage.getItem('tower-open'); if (want) { sessionStorage.removeItem('tower-open'); const i = buildings.findIndex(x => x.sid === want); if (i >= 0 && i !== curI) switchTo(i); } } catch {}
if (LIVE && !liveState.share && liveState.engine !== 'mock' && !liveState.chosen) openGuide();
setInterval(() => renderPanel(false), 400);
setInterval(() => { renderSwitch(); updateInbox(); syncPerm(); }, 700);
const ld = document.getElementById('loading'); ld.classList.add('hidden'); setTimeout(() => ld.remove(), 600);

const clock = new THREE.Clock();
let bgAcc = 0;
let atlasT = 0, scrT = 0;
function tick(raw) {
  const dt = Math.min(raw, 0.05), sdt = paused ? 0 : dt * simSpeed; T += sdt;
  const b = cur();
  if (sdt > 0) {
    for (let k = 0; k < simSpeed; k++) simBuilding(b, sdt / simSpeed);
    bgAcc += sdt;
    if (bgAcc > 0.1) { for (const o of buildings) if (o !== b) simBuilding(o, bgAcc); bgAcc = 0; }
  }
  animate(b, sdt);
  for (const cl of clouds.children) { cl.position.x += cl.userData.v * dt; if (cl.position.x > clouds.userData.max) cl.position.x = clouds.userData.min; }
  atlasT += dt; if (b.atlasDirty || atlasT > 0.25) { updateAtlas(b, b.atlasDirty); b.atlasDirty = false; atlasT = 0; }
  scrT += dt; if (scrT > 0.12) { scrT = 0; drawLiveScreens(); }
  stepCam(dt);
  renderer.render(scene, cam);
  overlay(b);
  quality(raw * 1000, performance.now());
}
renderer.setAnimationLoop(() => tick(clock.getDelta()));
window.__tower = { renderer, scene, buildings, SIT, step: (n = 60, dt = 1 / 60) => { for (let i = 0; i < n; i++) tick(dt); } };
</script>
